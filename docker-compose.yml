services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lovespace
      POSTGRES_USER: lovespace
      POSTGRES_PASSWORD: lovespace
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - lovespace-postgres:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lovespace -d lovespace"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lovespace-postgres:
